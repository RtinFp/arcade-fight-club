<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./static/styles/fonts.css" />
    <link rel="stylesheet" href="./static/styles/style.css" />
    <link rel="stylesheet" href="./static/styles/crt.css" />
    <link rel="icon" type="image/x-icon" href="./static/img/favicon.png" />
    <title>Arcade Fight Club!</title>
    <script>
      // دریافت مقادیر از بک‌اند (Flask)
      window.GAME_MODE = "{{ game_mode }}";
      window.PLAYER_ONE_NAME = "{{ player_one_html }}";
      window.PLAYER_TWO_NAME = "{{ player_two_html }}";
      window.ROOM_ID = "{{ room if room else '' }}";
      window.PLAYER_ROLE = "{{ player_role if player_role else '' }}";

      // اگر حالت آنلاین است و ROOM_ID وجود دارد، override کنید
      if (window.ROOM_ID && window.PLAYER_ROLE) {
        window.GAME_MODE = "online";
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".continue").forEach((btn) => {
          btn.addEventListener("click", () =>
            document.getElementById("soundEffect")?.play(),
          );
        });
      });
    </script>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <script type="module" src="./static/arcadeFight.js"></script>
  </head>
  <body>
    <audio id="song" autoplay loop>
      <source src="./static/sfx/gameplay.mp3" type="audio/mpeg" />
    </audio>
    <audio id="soundEffect">
      <source src="./static/sfx/hover.wav" />
    </audio>
    <section>
      <!-- Players health and combo bar -->
      <div id="health">
        <div id="player_one_health_container">
          <div id="player_one_health"></div>
          <div id="player_one_health_bar"></div>
          <h1 id="title" class="narrator_title"></h1>
        </div>
        <div id="player_two_health_container">
          <div id="player_two_health"></div>
          <div id="player_two_health_bar"></div>
          <h1 id="title" class="tyler_title"></h1>
        </div>
      </div>
      <div id="combo">
        <div id="player_one_combo_container">
          <div id="player_one_combo"></div>
          <div id="player_one_combo_bar"></div>
          <h4 id="combo_title">Combo: S</h4>
        </div>
        <div id="player_two_combo_container">
          <div id="player_two_combo"></div>
          <div id="player_two_combo_bar"></div>
          <h4 id="combo_title">Combo: L</h4>
        </div>
      </div>
      <div id="ready">
        <h2 id="ready_title">Ready?</h2>
        <br />
        <button class="continue" id="fight" type="button">Fight!</button>
        <form id="leaveClubForm" action="/arcadeFight" method="post">
          <button class="continue" type="submit">Club</button>
        </form>
      </div>
      <div id="log">
        <form
          id="exitForm"
          action="/arcadeFight"
          method="post"
          style="
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
          "
        >
          <h2 id="log_title"></h2>
          <br />
          <button id="exit" class="continue" type="submit">OK</button>
        </form>
        <script type="module">
          import { reportMatchResult, getMatchResult } from "./static/results.js";
          document.getElementById("exitForm")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const { winner, loser } = getMatchResult();
            // Backup post if the auto-report somehow missed.
            if (winner && loser) {
              await reportMatchResult(winner, loser);
            }
            window.location.href = "/";
          });
        </script>
      </div>
      <canvas width="1920" height="960"></canvas>
    </section>

    <script>
      document.querySelector(".narrator_title").innerText =
        window.PLAYER_ONE_NAME;
      document.querySelector(".tyler_title").innerText = window.PLAYER_TWO_NAME;
    </script>
  </body>
</html>
